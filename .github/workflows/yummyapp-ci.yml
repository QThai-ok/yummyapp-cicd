name: YummyApp CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code voi toc do cua chim canh cut
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8
        run: python -m flake8 gps_service.py yummy_app.py test_yummy_app.py

      - name: Run unit tests with coverage
        run: python -m coverage run -m unittest -v

      - name: Check coverage threshold
        run: python -m coverage report --fail-under=80

      - name: Generate HTML coverage report
        if: always()
        run: python -m coverage html

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yummyapp-coverage-report
          path: htmlcov/
          if-no-files-found: warn
